name: native_bottomsheet
description: "Native bottom sheets for DartNative — UISheetPresentationController on iOS, Compose ModalBottomSheet on Android."
version: 0.1.1
publish_to: none # Remove to publish. Add homepage/repository/issue_tracker first.

topics:
  - bottom-sheet
  - bottomsheet
  - dartnative
  - native-ui
  - ios
  - android

screenshots:
  - description: Every demo in the example app, with a sheet presented.
    path: doc/screenshots/example-app.png
  - description: Programmatic detent switching with controller.snapTo().
    path: doc/screenshots/detents.png
  - description: A non-dismissable sheet that can only be closed from its button.
    path: doc/screenshots/prevent-close.png

environment:
  sdk: ^3.12.0-192.0.dev

dependencies:
  meta: ^1.17.0
  ffi: ^2.1.0
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0

dartnative:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      android:
        package: com.dartnative.bottom_sheet
        pluginClass: DartNativeBottomSheetPlugin
  registrant:
    imports:
      - package:native_bottomsheet/native_bottomsheet.dart
    calls:
      - BottomSheetFFIBindings.loadSymbols();
