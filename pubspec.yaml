name: dartnative_bottom_sheet
description: "Native bottom sheets for DartNative — UISheetPresentationController on iOS, Compose ModalBottomSheet on Android."
version: 0.1.0
publish_to: none # Remove to publish. Add homepage/repository/issue_tracker first.

topics:
  - bottom-sheet
  - bottomsheet
  - dartnative
  - native-ui
  - ios
  - android

environment:
  sdk: ^3.12.0-192.0.dev

dependencies:
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  ffi: ^2.1.0

dartnative:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      android:
        package: com.dartnative.bottom_sheet
        pluginClass: DartNativeBottomSheetPlugin
  registrant:
    imports:
      - package:dartnative_bottom_sheet/dartnative_bottom_sheet.dart
    calls:
      - BottomSheetFFIBindings.loadSymbols();

